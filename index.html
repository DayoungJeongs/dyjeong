<!DOCTYPE html><html lang="en"><head>
  <link rel="canonical" href="https://dyjeong.com/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dayoung Jeong</title><meta name="description" content="Dayoung Jeong — Associate Professor of Law, Chungnam National University Law School."><meta property="og:title" content="Dayoung Jeong"><meta property="og:description" content="Chungnam National University Law School, South Korea"><meta property="og:image" content="https://dyjeong.com/assets/og-image.png"><meta property="og:url" content="https://dyjeong.com/"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><link rel="stylesheet" href="style.css"><style>  @font-face {    font-family: 'Pinyon Script';    src: url('assets/fonts/PinyonScript.ttf') format('truetype');    font-display: block;  }  .intro-screen {    min-height: 100vh;    display: flex;    align-items: center;    justify-content: center;    padding: 2rem;    background: var(--color-bg);  }  /* On phones the signature otherwise sits slightly below true center;     nudge it up by biasing the flex alignment rather than changing the     SVG's internal text position (which would also shift the desktop     layout, where the current position already looks right). */  @media (max-width: 600px) {    .intro-screen {      align-items: flex-start;      padding-top: 35vh;    }  }  .intro-link {    border-bottom: none;    display: block;  }  .intro-svg {    width: min(88vw, 900px);    height: auto;    overflow: visible;  }  .intro-svg text {    font-family: 'Pinyon Script', 'Brush Script MT', cursive;    /* Scales with viewport width but is capped. Larger overall than before       on both ends: bigger minimum on phones, and a noticeably bigger       maximum on desktop so the signature reads as a real focal point. */    font-size: clamp(130px, 30vw, 140px);    letter-spacing: 0.02em;  }  /* Each letter is its own tspan; each draws in turn, like a pen writing     one stroke at a time, left to right — the stroke itself IS the ink     (no separate "fill in" pass), so the line looks hand-drawn throughout. */  .intro-svg tspan {    fill: var(--color-accent);    stroke: var(--color-accent);    stroke-width: 2.5;    stroke-linecap: round;    stroke-linejoin: round;    stroke-dasharray: 300;    stroke-dashoffset: 300;    animation: letter-draw 0.55s ease-out forwards;  }
